<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>朝のダイジェスト 2026-08-19</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#faf8f4; --card:#ffffff; --ink:#26221c; --sub:#726a5e; --line:#e6e0d4;
        --accent:#b3541e; --ai:#b3541e; --market:#2f6b4f; --world:#4a5a86; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1c1a16; --card:#26231e; --ink:#ece7dd; --sub:#a89e8e; --line:#3a352c;
          --accent:#e0813f; --ai:#e0813f; --market:#6fb392; --world:#8fa3d9; }
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans JP',sans-serif;
       line-height:1.75; padding:24px 16px 64px; max-width:640px; margin:0 auto; }
header { margin-bottom:24px; }
.date { font-size:13px; color:var(--sub); letter-spacing:.08em; }
h1 { font-size:22px; font-weight:700; margin:4px 0 8px; }
.special { display:inline-block; background:var(--accent); color:#fff; font-size:12px;
           font-weight:500; padding:2px 10px; border-radius:8px; margin-bottom:8px; }
.hook { font-size:14px; color:var(--sub); border-left:3px solid var(--accent);
        padding-left:12px; margin-top:8px; }
.fbnote { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:12px 16px; font-size:13px; color:var(--sub); margin:16px 0; }
.market { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 24px; }
.chip { background:var(--card); border:1px solid var(--line); border-radius:8px;
        padding:6px 10px; font-size:12px; }
.chip b { font-size:13px; }
.up { color:#2e8b57; } .down { color:#c0392b; }
h2 { font-size:14px; letter-spacing:.1em; color:var(--sub); margin:32px 0 12px;
     text-transform:uppercase; }
article { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:16px; margin-bottom:12px; border-left-width:4px; }
article.ai { border-left-color:var(--ai); }
article.market { border-left-color:var(--market); }
article.world { border-left-color:var(--world); }
article h3 { font-size:16px; font-weight:700; line-height:1.5; }
article h3 a { color:var(--ink); text-decoration:none; }
article h3 a:active { color:var(--accent); }
.meta { font-size:12px; color:var(--sub); margin:4px 0 8px; display:flex; gap:8px;
        align-items:center; flex-wrap:wrap; }
.meta a { color:var(--sub); text-decoration:none; display:inline-flex; gap:4px;
          align-items:center; }
.fav { width:14px; height:14px; border-radius:3px; }
.hero { width:100%; max-height:300px; object-fit:cover; border-radius:8px;
        margin:8px 0; display:block; }
.video { position:relative; padding-top:56.25%; margin:8px 0; }
.video iframe { position:absolute; inset:0; width:100%; height:100%; border:0;
                border-radius:8px; }
.twitter-tweet { margin:8px auto !important; }
.badge { border:1px solid var(--line); border-radius:8px; padding:0 6px; font-size:11px; }
.followup { background:var(--world); color:#fff; border:none; }
.fire { letter-spacing:1px; }
.summary { font-size:14px; }
.fb { margin-top:48px; background:var(--card); border:1px solid var(--line);
      border-radius:8px; padding:24px 16px; text-align:center; }
.fb p { font-size:14px; margin-bottom:16px; }
.fb-btns { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
.fb-btns button { font-family:inherit; font-size:14px; padding:10px 14px; border-radius:8px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
.fb-btns button.sel { border-color:var(--accent); background:var(--accent); color:#fff; }
textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:8px;
  padding:10px; font-family:inherit; font-size:14px; background:var(--bg); color:var(--ink); }
.fb-send { margin-top:8px; font-family:inherit; font-size:14px; padding:10px 24px;
  border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; }
.fb-done { color:var(--sub); font-size:13px; min-height:20px; margin-top:8px; }
footer { margin-top:32px; text-align:center; font-size:12px; color:var(--sub); }
footer a { color:var(--sub); }
</style>
</head>
<body>
<header>
  <div class="date">2026年8月19日（水）</div>
  <h1>朝のダイジェスト</h1>
  
  <div class="hook">今朝は自動選別モードでお届け（編集AIが不調でした）。</div>
</header>



<div class="fb" id="fb">
  <p>今朝のダイジェスト、どうだった？</p>
  <div class="fb-btns">
    <button onclick="rate(this,'good')">😊 良かった</button>
    <button onclick="rate(this,'ok')">😐 普通</button>
    <button onclick="rate(this,'bad')">🤔 イマイチ</button>
  </div>
  <textarea id="fbtext" placeholder="ひとことあれば（音声入力でもOK）"></textarea>
  <br><button class="fb-send" onclick="sendText()">送信</button>
  <div class="fb-done" id="fbdone"></div>
</div>
<footer><a href="./">過去のダイジェスト</a></footer>
<script>
var NTFY = "https://ntfy.sh", FB_TOPIC = "seika-news-fb-goutfsay", DATE = "2026-08-19";
function post(payload, done) {
  fetch(NTFY, { method: "POST",
    body: JSON.stringify({ topic: FB_TOPIC, message: JSON.stringify(payload) }) })
    .then(function(){ document.getElementById("fbdone").textContent = done; })
    .catch(function(){ document.getElementById("fbdone").textContent = "送信に失敗、また後で"; });
}
function rate(btn, r) {
  var btns = document.querySelectorAll(".fb-btns button");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("sel");
  btn.classList.add("sel");
  post({ date: DATE, rating: r }, "記録したよ、ありがとう");
}
function sendText() {
  var t = document.getElementById("fbtext").value.trim();
  if (!t) return;
  post({ date: DATE, text: t }, "コメント送信したよ");
  document.getElementById("fbtext").value = "";
}
</script>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</body>
</html>
